name: publish

# Publishes the package to GitHub Packages when a v* tag is pushed.
# GITHUB_TOKEN already carries packages:write for this repository, so no PAT
# and no repository secret is needed here. A failed publish is fixed and
# re-tagged one patch up; a tag is never force-moved.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Version in package.json must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      - name: Syntax check every shipped file
        run: |
          for f in engine/lib.mjs tools/*.mjs bin/*; do node --check "$f"; done

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
