name: bbe-gate (reusable)

# The brand gate, once, for every repo in the estate.
#
# A consumer does not copy this file. It calls it:
#
#   jobs:
#     brand-gate:
#       uses: andrew22lane/bbe/.github/workflows/bbe-gate.yml@v1.2.0
#
# That is the whole consumer workflow. Before this, sixteen repos each carried a
# vendored brand-drift.mjs + brand-gate-check.mjs + gate-parity.mjs + a baseline
# JSON + their own copy of these steps. Measured 2026-09-08: three different
# revisions of brand-drift.mjs were live at the same time, so "the gate" meant
# three different things depending on which repo you were standing in.
#
# What it runs, against the caller's checkout:
#   1. npm ci when there is a lockfile, npm install when there is not
#   2. the build, ONLY when bbe.config.json names a "buildDir"
#   3. bbe-gate --selftest   — the scanner plants a defect in a fixture and asserts RED
#   4. bbe-gate              — the ratchet, against the caller's bbe.config.json
#
# Step 2 exists because an engine site writes its pages at build time. Its source
# holds no page, so the kit link check and the head check have nothing to read until
# the build runs. A repo with no "buildDir" skips it and runs exactly as before.
# Nothing here deploys anything.

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version for the gate run.'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Directory holding bbe.config.json, if it is not the repo root.'
        required: false
        type: string
        default: '.'
      ref:
        description: 'Ref to check out. Defaults to the event ref.'
        required: false
        type: string
        default: ''
      build-command:
        description: 'Runs before the gate when bbe.config.json names a "buildDir". Ignored otherwise.'
        required: false
        type: string
        default: 'npm run build'

permissions:
  contents: read

jobs:
  brand-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # npm ci needs a lockfile and fails without one. Most surfaces in this estate
      # have no lockfile because they have no runtime dependencies beyond the engine,
      # so pick the right one instead of asking every repo to commit a lockfile it
      # does not otherwise need.
      - name: install
        run: |
          if [ -f package-lock.json ]; then
            echo "lockfile present -> npm ci"
            npm ci --no-audit --no-fund
          else
            echo "no lockfile -> npm install"
            npm install --no-audit --no-fund
          fi

      - name: build (only when bbe.config.json names a buildDir)
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          BUILD_DIR=$(node -e "try{process.stdout.write(String(require('./bbe.config.json').buildDir||''))}catch(e){}")
          if [ -n "$BUILD_DIR" ]; then
            echo "buildDir $BUILD_DIR -> $BUILD_COMMAND"
            sh -c "$BUILD_COMMAND"
          else
            echo "no buildDir in bbe.config.json -> nothing to build"
          fi

      - name: brand-drift selftest
        run: npx bbe-gate --selftest

      - name: brand gate (ratchet against bbe.config.json)
        run: npx bbe-gate
